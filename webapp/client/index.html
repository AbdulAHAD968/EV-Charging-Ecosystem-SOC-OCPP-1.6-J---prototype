<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EV-SOC Live</title>
    <meta name="description" content="A live Security Operations Center for an EV charging network: real OCPP traffic, scripted attacks, and live detection, watchable in your browser." />

    <!-- Open Graph / link-preview tags (WhatsApp, Slack, Discord, iMessage, etc). These
         must use an absolute URL (not a relative path) for og:url and og:image, since the
         crawler that builds the preview fetches them directly and has no page context to
         resolve a relative path against. This is a single-page app with no per-route
         server-rendered HTML, so every route shares this one preview; that is normal for
         an SPA and does not need per-page metadata to fix. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EV-SOC Live" />
    <meta property="og:title" content="EV-SOC Live: a real-time SOC for an EV charging network" />
    <meta property="og:description" content="Real OCPP traffic, scripted attacks, and live detection, watchable in your browser." />
    <meta property="og:url" content="https://soc.sevenlabs.site/" />
    <meta property="og:image" content="https://soc.sevenlabs.site/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EV-SOC Live: a live Security Operations Center for an EV charging site" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EV-SOC Live: a real-time SOC for an EV charging network" />
    <meta name="twitter:description" content="Real OCPP traffic, scripted attacks, and live detection, watchable in your browser." />
    <meta name="twitter:image" content="https://soc.sevenlabs.site/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
