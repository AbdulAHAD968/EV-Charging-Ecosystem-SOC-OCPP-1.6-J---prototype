[EVSOC A1 WS brute force]
search = index=ev_soc event=ws_auth result=failure | bin _time span=2m | stats count dc(cp_id) as ids by _time src_ip | where count>=10
dispatch.earliest_time = 0
[EVSOC A1 RFID guessing]
search = index=ev_soc event=id_authorize status!=Accepted | bin _time span=2m | stats count by _time cp_id | where count>=10
dispatch.earliest_time = 0
[EVSOC A2 session from unregistered IP]
search = index=ev_soc event=ws_auth result=success | lookup ev_inventory cp_id OUTPUT ip as expected_ip | where src_ip!=expected_ip
dispatch.earliest_time = 0
[EVSOC A2 implausible power]
search = index=ev_soc event=meter_value | eval rated_w=rated_kw*1000 | where power_w>1.2*rated_w
dispatch.earliest_time = 0
[EVSOC A3 connection flood]
search = index=ev_soc event=ws_auth | bin _time span=30s | stats count by _time src_ip | where count>=100
dispatch.earliest_time = 0
